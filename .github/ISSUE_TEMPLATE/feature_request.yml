name: 功能建议
description: 提出新功能或改进现有行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个仓库包含后端接口和 Web 前端。客户端问题请到对应仓库反馈：Android / iOS / 小程序。

        提建议前请先搜索已有 Issue，也看一下 README 里写明的功能边界——有些「缺失」是有意的。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先讲场景和卡点，不要直接跳到方案。
      placeholder: 例如：每周排课后要手动对着教室查空教室，太麻烦
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么做
      description: 一句话描述期望的行为即可。不用写实现方案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过
      description: 目前的做法，或者你试过但不合适的方案。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及的模块
      options:
        - 教务（成绩、课表、考试）
        - 校园卡与生活缴费
        - 社区（二手、树洞、表白墙等）
        - 消息与私信
        - 个人中心与设置
        - 其他 / 不确定
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
        - label: 我理解这是学生维护的项目，不保证实现时间
          required: true
