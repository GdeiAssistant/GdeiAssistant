version: 2
updates:
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    vitest-toolchain:
      patterns:
      - vitest
      - '@vitest/*'
    vitest-security:
      applies-to: security-updates
      patterns:
      - vitest
      - '@vitest/*'
    frontend-minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:30
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    backend-minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    github-actions-minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
