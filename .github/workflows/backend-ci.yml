name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gdei_synthetic_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mongodb:
        # 8.0 cannot start on Linux 6.19 and newer: it exits with "MongoDB
        # cannot start: Linux kernel versions 6.19 and newer has a known
        # incompatibility" (SERVER-121912). Every hosted runner is on 7.0 now,
        # so the container never comes up and this job fails before checkout.
        # 8.2 starts and answers ping on the same hosts.
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: synthetic_admin
          MONGO_INITDB_ROOT_PASSWORD: synthetic_ci_only
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Initialize isolated upgrade fixture
        run: docker exec -i "${{ job.services.mysql.id }}" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot' < src/test/resources/db/architecture-before.sql

      - name: Run tests
        run: ./gradlew check architectureCoverage jacocoTestReport
        env:
          # Non-dev: no verbose SQL logging by default in CI
          GDEI_UPGRADE_TEST_JDBC_BASE: jdbc:mysql://127.0.0.1:3306/
          GDEI_UPGRADE_TEST_PASSWORD: gdei_synthetic_ci
          GDEI_MONGO_TEST_PORT: '27017'
          GDEI_REDIS_TEST_PORT: '6379'
          MYBATIS_LOG_IMPL: ""
          LOG_LEVEL_SQL: "WARN"
          LOG_LEVEL_IBATIS: "WARN"
          LOG_LEVEL_MYBATIS: "WARN"

      - name: Upload full coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: build/reports/jacoco/test/
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
