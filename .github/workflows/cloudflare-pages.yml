name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment: web-production
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_APP_BASE_API: https://gdeiassistant.azurewebsites.net/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install pinned publishing tool without deployment credentials
        run: npm install --prefix "$RUNNER_TEMP/cloudflare-tools" --no-audit --no-fund wrangler@4.152.0
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"$RUNNER_TEMP/cloudflare-tools/node_modules/.bin/wrangler" pages deploy frontend/dist --project-name gdeiassistant --branch master'
