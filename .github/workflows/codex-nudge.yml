# Shared governance action: GdeiAssistant/.github/pr-governance@432b04be379fe47e6f77a2f528181cd34a20379f.
# Keep the job names; they are required status check contexts.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: review-request
  cancel-in-progress: false

jobs:
  nudge:
    name: Request a review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request
        uses: GdeiAssistant/.github/pr-governance@432b04be379fe47e6f77a2f528181cd34a20379f
        with:
          mode: nudge
