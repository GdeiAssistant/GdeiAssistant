# Shared governance action: GdeiAssistant/.github/pr-governance@4c296692ae2efbce09bc21b6641299f368435c40.
# Keep the job names; they are required status check contexts.

name: Review request

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: review-request
  cancel-in-progress: false

jobs:
  nudge:
    name: Request a review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request
        uses: GdeiAssistant/.github/pr-governance@4c296692ae2efbce09bc21b6641299f368435c40
        with:
          mode: nudge
