name: Dependabot Auto Merge
on:
  workflow_run:
    workflows: [Backend CI, Frontend CI, WeChat Mini Program CI, Android CI, iOS CI, CodeQL Security Analysis, Repository hygiene, Dependabot update policy]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge:
    name: Merge verified Dependabot patches
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      # github.sha belongs to the trusted default branch for workflow_run.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge only the verified head
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: |
            Build and Test
            Analyze (Java)
            Frontend verification
            Repository hygiene
            Safe dependency update
        run: node .github/scripts/dependabot-policy.cjs merge
