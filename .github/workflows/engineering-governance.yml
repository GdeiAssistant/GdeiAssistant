name: Engineering governance

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        run: bash .github/scripts/install-gitleaks.sh
      - name: Test secret detection and baseline behavior
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-bin/gitleaks
        run: python3 .github/scripts/test_secret_scan.py
      - name: Scan added commits with redacted findings
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          head="${PR_HEAD:-$PUSH_HEAD}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No base commit is available for this event" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --config .gitleaks.toml --redact --no-banner --log-opts="$base..$head"

  commitlint:
    name: Commit message convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/governance-commitlint"
          npm install --prefix "$tool" --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          printf '%s\n' "module.exports = {extends: [require.resolve('@commitlint/config-conventional')], defaultIgnores: true, rules: {'subject-case': [0], 'header-max-length': [2, 'always', 72], 'type-enum': [2, 'always', ['feat', 'fix', 'docs', 'refactor', 'test', 'chore', 'perf', 'ci']]}};" > "$tool/commitlint.config.cjs"
          for message in 'Merge bypass' 'Merge fix: bypass'; do
            if printf '%s\n' "$message" | node "$tool/node_modules/@commitlint/cli/cli.js" --config "$tool/commitlint.config.cjs" >/dev/null 2>&1; then
              echo "commitlint incorrectly ignored: $message" >&2
              exit 1
            fi
          done
          node "$tool/node_modules/@commitlint/cli/cli.js" \
            --config "$tool/commitlint.config.cjs" --from "$PR_BASE" --to "$PR_HEAD" --verbose
