# Shared governance action: GdeiAssistant/.github/pr-governance@4c296692ae2efbce09bc21b6641299f368435c40.
# Keep the job names; they are required status check contexts.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan added commits
        uses: GdeiAssistant/.github/pr-governance@4c296692ae2efbce09bc21b6641299f368435c40
        with:
          mode: scan
