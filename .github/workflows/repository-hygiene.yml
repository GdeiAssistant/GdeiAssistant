name: Repository hygiene
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify checker regressions
        run: python scripts/test_hygiene.py
      - name: Check versioned instructions and repository hygiene
        run: python scripts/check_hygiene.py
      - name: Install workflow checker dependency
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Verify workflow safety regressions
        run: python .github/scripts/test_workflows.py
      - name: Check workflow safety
        run: python .github/scripts/check_workflows.py
      - name: Check workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Verify dependency policy regressions
        run: node --test .github/scripts/test-dependabot-policy.cjs
