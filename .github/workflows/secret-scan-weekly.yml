name: Weekly secret scan

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install verified Gitleaks CLI
        run: bash .github/scripts/install-gitleaks.sh
      - name: Scan all history against redacted baseline
        id: scan
        run: >-
          python3 .github/scripts/secret_scan.py history
          --gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          --summary "$RUNNER_TEMP/secret-summary.json"
      - name: Scan redacted summary before upload
        id: artifact_scan
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        env:
          ARTIFACT_PATHS: ${{ runner.temp }}/secret-summary.json
        run: >-
          python3 .github/scripts/secret_scan.py artifacts
          --gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks"
      - name: Upload redacted finding identities only
        if: ${{ !cancelled() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: secret-scan-summary
          path: ${{ runner.temp }}/secret-summary.json
          if-no-files-found: error
          retention-days: 3
