openapi: 3.1.0
info:
  title: GdeiAssistant API
  description: |
    多端（Web / Android / iOS / 微信小程序）共享的后端 REST 契约骨架。
    本文件为**真相源（source of truth）**的初版索引；请求/响应 schema 将随实现迭代补充。
    鉴权：除 `/api/auth/*` 等白名单外，需在 Header 携带 `Authorization: Bearer <JWT>`。
  version: 2.0.0
  contact:
    name: GdeiAssistant
    url: https://github.com/GdeiAssistant/GdeiAssistant

servers:
  - url: http://localhost:8080
    description: development
  - url: https://gdeiassistant.azurewebsites.net
    description: staging
  - url: https://gdeiassistant.cn
    description: production

tags:
  - name: auth
    description: 登录、登出、Token 校验
  - name: campus-credential
    description: 校园凭证授权、撤回与快速认证
  - name: profile
    description: 用户资料与头像
  - name: academic
    description: 教务查询（成绩、课表、四六级等）
  - name: campus-service
    description: 校园服务（校园卡、图书馆、教室等）
  - name: community
    description: 社区功能（树洞、二手、快递等）
  - name: information
    description: 资讯与消息

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      security: []
  /api/auth/logout:
    post:
      tags: [auth]
      summary: 用户登出
  /api/auth/validate:
    get:
      tags: [auth]
      summary: 校验当前 Token

  /api/campus-credential/status:
    get:
      tags: [campus-credential]
      summary: 查询校园凭证绑定与授权状态
  /api/campus-credential/consent:
    post:
      tags: [campus-credential]
      summary: 记录用户授权同意
  /api/campus-credential/revoke:
    post:
      tags: [campus-credential]
      summary: 撤回授权
  /api/campus-credential:
    delete:
      tags: [campus-credential]
      summary: 删除已保存的校园凭证
  /api/campus-credential/quick-auth:
    post:
      tags: [campus-credential]
      summary: 更新快速认证开关

  /api/user/profile:
    get:
      tags: [profile]
      summary: 获取当前用户资料
  /api/profile/avatar:
    get:
      tags: [profile]
      summary: 获取头像
    post:
      tags: [profile]
      summary: 上传头像
    delete:
      tags: [profile]
      summary: 删除头像

  /api/grade:
    get:
      tags: [academic]
      summary: 查询成绩
  /api/schedule:
    get:
      tags: [academic]
      summary: 查询课表
  /api/cet/query:
    get:
      tags: [academic]
      summary: 四六级成绩查询
  /api/graduate-exam/query:
    post:
      tags: [academic]
      summary: 考研成绩查询

  /api/card/info:
    get:
      tags: [campus-service]
      summary: 校园卡信息
  /api/card/query:
    post:
      tags: [campus-service]
      summary: 校园卡交易查询
  /api/card/charge:
    post:
      tags: [campus-service]
      summary: 校园卡充值
  /api/library/search:
    get:
      tags: [campus-service]
      summary: 图书馆检索
  /api/spare/query:
    post:
      tags: [campus-service]
      summary: 空教室查询

  /api/secret/info/start/{start}/size/{size}:
    get:
      tags: [community]
      summary: 树洞列表（分页）
  /api/secret/info:
    post:
      tags: [community]
      summary: 发布树洞
  /api/ershou/item/start/{start}:
    get:
      tags: [community]
      summary: 二手商品列表
  /api/express/start/{start}/size/{size}:
    get:
      tags: [community]
      summary: 全民快递列表
  /api/lostandfound/lostitem/start/{start}:
    get:
      tags: [community]
      summary: 失物招领列表

  /api/information/overview:
    get:
      tags: [information]
      summary: 资讯概览
  /api/information/news/type/{type}/start/{start}/size/{size}:
    get:
      tags: [information]
      summary: 新闻列表
  /api/information/message/unread:
    get:
      tags: [information]
      summary: 未读消息数

  /api/module/state:
    get:
      tags: [campus-service]
      summary: 功能模块开关状态

  # --- Social Messaging（契约见 docs/SOCIAL_MESSAGING_DESIGN.zh-CN.md；错误体含 success/code/message/errorCode）---
  /api/social/me:
    get:
      tags: [community]
      summary: 当前用户社交资料
  /api/social/users:
    get:
      tags: [community]
      summary: 搜索用户（SQL 过滤 inactive/双向 block 后再 limit）
  /api/social/users/{id}:
    get:
      tags: [community]
      summary: 公开主页（拉黑双方按 USER_NOT_FOUND）
  /api/social/users/{id}/avatar:
    get:
      tags: [community]
      summary: 鉴权代理头像（与主页同访问规则；响应不泄漏校园路径）
  /api/social/users/{id}/relationships:
    get:
      tags: [community]
      summary: following|followers|friends 列表
  /api/social/users/{id}/follow:
    put:
      tags: [community]
      summary: 关注
    delete:
      tags: [community]
      summary: 取消关注
  /api/social/users/{id}/block:
    put:
      tags: [community]
      summary: 拉黑
    delete:
      tags: [community]
      summary: 取消拉黑
  /api/social/blocks:
    get:
      tags: [community]
      summary: 自己的黑名单
  /api/social/privacy:
    get:
      tags: [community]
      summary: 读取 dmPolicy
    put:
      tags: [community]
      summary: 更新 dmPolicy（ALL|FOLLOWING|MUTUAL|NONE）
  /api/social/unread:
    get:
      tags: [community]
      summary: 私信未读总数
  /api/social/conversations:
    get:
      tags: [community]
      summary: 会话列表（已关闭 peer 仍可读，显示已注销且不可发送；含 imageMessagingEnabled）
    post:
      tags: [community]
      summary: 创建或获取一对一会话
  /api/social/conversations/{id}:
    get:
      tags: [community]
      summary: 会话详情（非成员 404 CONVERSATION_NOT_FOUND；含 imageMessagingEnabled）
  /api/social/conversations/{id}/messages:
    get:
      tags: [community]
      summary: 消息分页（beforeSeq|afterSeq 互斥；type 缺省按 TEXT；IMAGE 含 image 元数据）
    post:
      tags: [community]
      summary: 发送文字消息（clientMessageId 幂等；type=TEXT；事务 afterCommit 推送）
  /api/social/conversations/{id}/messages/image:
    post:
      tags: [community]
      summary: 发送图片消息（multipart clientMessageId+image；规范化 JPEG/PNG；缺 chat bucket 时 SOCIAL_IMAGE_UNAVAILABLE）
  /api/social/conversations/{id}/messages/{messageId}/image:
    get:
      tags: [community]
      summary: 鉴权代理读图（成员+消息属会话；历史可读；Cache-Control private no-store；不返回 key/bucket）
  /api/social/conversations/{id}/read:
    put:
      tags: [community]
      summary: 回写已读游标（并发后取实际最新值；多设备同步）
  /api/social/realtime:
    get:
      tags: [community]
      summary: WebSocket 实时通道（握手可无 Bearer；首帧 auth；过期/撤销周期核验）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
