# =============================================================================
# GdeiAssistant 主配置
# 统一使用一份 application.yml，并通过环境变量或 .env 注入环境差异。
# =============================================================================

spring:
  application:
    name: GdeiAssistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    app:
      jdbc-url: ${DB_JDBC_URL_APP:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gdeiassistant}?${DB_JDBC_PARAMS:useUnicode=true&characterEncoding=utf-8&useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
    log:
      jdbc-url: ${DB_JDBC_URL_LOG:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_LOG:gdeiassistant_log}?${DB_JDBC_PARAMS:useUnicode=true&characterEncoding=utf-8&useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
    data:
      jdbc-url: ${DB_JDBC_URL_DATA:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_DATA:gdeiassistant_data}?${DB_JDBC_PARAMS:useUnicode=true&characterEncoding=utf-8&useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mongodb:
    uri: ${MONGO_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:gdeiassistant}}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    log-impl: ${MYBATIS_LOG_IMPL:}
  type-handlers-package: cn.gdeiassistant.common.typehandler

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    cn.gdeiassistant: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.mybatis: ${LOG_LEVEL_MYBATIS:INFO}
    java.sql: ${LOG_LEVEL_SQL:INFO}
    org.apache.ibatis: ${LOG_LEVEL_IBATIS:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:}

email:
  smtp:
    host: ${EMAIL_SMTP_HOST:}
    port: ${EMAIL_SMTP_PORT:465}
    username: ${EMAIL_SMTP_USERNAME:}
    password: ${EMAIL_SMTP_PASSWORD:}
    auth: true
    timeout: 5000
  ssl:
    encryption: ${EMAIL_SMTP_SSL:false}
  from: ${EMAIL_FROM:${EMAIL_SMTP_USERNAME:}}
  feedback: ${EMAIL_FEEDBACK:}
  ticket: ${EMAIL_TICKET:}

encrypt:
  enable: ${ENCRYPT_ENABLE:false}
  type: ${ENCRYPT_TYPE:aes}
  private:
    key: ${ENCRYPT_PRIVATE_KEY:}

api:
  ai:
    # One deployment uses one processing region; fallback obeys the same policy.
    region: ${AI_SERVICE_REGION:MAINLAND}
    endpoints:
      - id: doubao
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${DOUBAO_BASE_URL:${DOUBAO_OCR_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}}
        api-key: ${DOUBAO_API_KEY:}
        routes:
          ocr: ${DOUBAO_OCR_MODEL:}
          chat: ${DOUBAO_CHAT_MODELS:}
        priority: 0
      - id: deepseek
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${DEEPSEEK_BASE_URL:${DEEPSEEK_OCR_BASE_URL:https://api.deepseek.com/v1}}
        api-key: ${DEEPSEEK_API_KEY:}
        routes:
          ocr: ${DEEPSEEK_OCR_MODEL:}
          chat: ${DEEPSEEK_CHAT_MODELS:}
        priority: 1
      - id: qwen
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${QWEN_BASE_URL:${QWEN_OCR_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
        api-key: ${QWEN_API_KEY:}
        routes:
          ocr: ${QWEN_OCR_MODEL:}
          chat: ${QWEN_CHAT_MODELS:}
        priority: 2
      - id: siliconflow
        region: MAINLAND
        access-mode: AGGREGATOR
        protocol: OPENAI_CHAT
        base-url: ${SILICONFLOW_BASE_URL:${SILICONFLOW_OCR_BASE_URL:https://api.siliconflow.cn/v1}}
        api-key: ${SILICONFLOW_API_KEY:}
        routes:
          ocr: ${SILICONFLOW_OCR_MODEL:}
          chat: ${SILICONFLOW_CHAT_MODELS:}
        priority: 3
      - id: openai
        region: OVERSEAS
        access-mode: DIRECT
        protocol: OPENAI_RESPONSES
        base-url: ${OPENAI_BASE_URL:${OPENAI_OCR_BASE_URL:https://api.openai.com/v1}}
        api-key: ${OPENAI_API_KEY:}
        routes:
          ocr: ${OPENAI_OCR_MODEL:}
          chat: ${OPENAI_CHAT_MODELS:}
        priority: 4
      - id: claude
        region: OVERSEAS
        access-mode: DIRECT
        protocol: ANTHROPIC
        base-url: ${CLAUDE_BASE_URL:${CLAUDE_OCR_BASE_URL:https://api.anthropic.com/v1}}
        api-key: ${CLAUDE_API_KEY:}
        routes:
          ocr: ${CLAUDE_OCR_MODEL:}
          chat: ${CLAUDE_CHAT_MODELS:}
        priority: 5
      - id: gemini
        region: OVERSEAS
        access-mode: DIRECT
        protocol: GEMINI
        base-url: ${GEMINI_BASE_URL:${GEMINI_OCR_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}
        api-key: ${GEMINI_API_KEY:}
        routes:
          ocr: ${GEMINI_OCR_MODEL:}
          chat: ${GEMINI_CHAT_MODELS:}
        priority: 6
      - id: openrouter
        region: OVERSEAS
        access-mode: AGGREGATOR
        protocol: OPENAI_CHAT
        base-url: ${OPENROUTER_BASE_URL:${OPENROUTER_OCR_BASE_URL:https://openrouter.ai/api/v1}}
        api-key: ${OPENROUTER_API_KEY:}
        routes:
          ocr: ${OPENROUTER_OCR_MODEL:}
          chat: ${OPENROUTER_CHAT_MODELS:}
        priority: 7
      - id: opencode-openai
        region: OVERSEAS
        access-mode: AGGREGATOR
        protocol: OPENAI_RESPONSES
        base-url: ${OPENCODE_OPENAI_BASE_URL:${OPENCODE_OPENAI_OCR_BASE_URL:https://opencode.ai/inference/openai/v1}}
        api-key: ${OPENCODE_API_KEY:}
        routes:
          ocr: ${OPENCODE_OPENAI_OCR_MODEL:}
          chat: ${OPENCODE_OPENAI_CHAT_MODELS:}
        priority: 8
        authentication: BEARER
      - id: opencode-claude
        region: OVERSEAS
        access-mode: AGGREGATOR
        protocol: ANTHROPIC
        base-url: ${OPENCODE_CLAUDE_BASE_URL:${OPENCODE_CLAUDE_OCR_BASE_URL:https://opencode.ai/inference/anthropic/v1}}
        api-key: ${OPENCODE_API_KEY:}
        routes:
          ocr: ${OPENCODE_CLAUDE_OCR_MODEL:}
          chat: ${OPENCODE_CLAUDE_CHAT_MODELS:}
        priority: 9
        authentication: BEARER
      - id: opencode-chat
        region: OVERSEAS
        access-mode: AGGREGATOR
        protocol: OPENAI_CHAT
        base-url: ${OPENCODE_CHAT_BASE_URL:${OPENCODE_CHAT_OCR_BASE_URL:https://opencode.ai/inference/openai/v1}}
        api-key: ${OPENCODE_API_KEY:}
        routes:
          ocr: ${OPENCODE_CHAT_OCR_MODEL:}
          chat: ${OPENCODE_CHAT_MODELS:}
        priority: 10
        authentication: BEARER
      - id: opencode-gemini
        region: OVERSEAS
        access-mode: AGGREGATOR
        protocol: GEMINI
        base-url: ${OPENCODE_GEMINI_BASE_URL:${OPENCODE_GEMINI_OCR_BASE_URL:https://opencode.ai/inference/google/v1beta}}
        api-key: ${OPENCODE_API_KEY:}
        routes:
          ocr: ${OPENCODE_GEMINI_OCR_MODEL:}
          chat: ${OPENCODE_GEMINI_CHAT_MODELS:}
        priority: 11
        authentication: BEARER

      - id: zhipu
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${ZHIPU_API_KEY:}
        routes:
          ocr: ${ZHIPU_OCR_MODEL:}
          chat: ${ZHIPU_CHAT_MODELS:}
        priority: 12
      - id: moonshot
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
        api-key: ${MOONSHOT_API_KEY:}
        routes:
          ocr: ${MOONSHOT_OCR_MODEL:}
          chat: ${MOONSHOT_CHAT_MODELS:}
        priority: 13
      - id: minimax
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/v1}
        api-key: ${MINIMAX_API_KEY:}
        routes:
          ocr: ${MINIMAX_OCR_MODEL:}
          chat: ${MINIMAX_CHAT_MODELS:}
        priority: 14
      - id: baidu
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${BAIDU_BASE_URL:https://qianfan.baidubce.com/v2}
        api-key: ${BAIDU_API_KEY:}
        routes:
          ocr: ${BAIDU_OCR_MODEL:}
          chat: ${BAIDU_CHAT_MODELS:}
        priority: 15
      - id: hunyuan
        region: MAINLAND
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${HUNYUAN_BASE_URL:https://api.hunyuan.cloud.tencent.com/v1}
        api-key: ${HUNYUAN_API_KEY:}
        routes:
          ocr: ${HUNYUAN_OCR_MODEL:}
          chat: ${HUNYUAN_CHAT_MODELS:}
        priority: 16
      - id: xai
        region: OVERSEAS
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${XAI_BASE_URL:https://api.x.ai/v1}
        api-key: ${XAI_API_KEY:}
        routes:
          ocr: ${XAI_OCR_MODEL:}
          chat: ${XAI_CHAT_MODELS:}
        priority: 17
      - id: mistral
        region: OVERSEAS
        access-mode: DIRECT
        protocol: OPENAI_CHAT
        base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
        api-key: ${MISTRAL_API_KEY:}
        routes:
          ocr: ${MISTRAL_OCR_MODEL:}
          chat: ${MISTRAL_CHAT_MODELS:}
        priority: 18

sms:
  tencent:
    secret-id: ${TENCENT_SMS_SECRET_ID:}
    secret-key: ${TENCENT_SMS_SECRET_KEY:}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    app-id: ${TENCENT_SMS_APP_ID:}
    sign-name: ${TENCENT_SMS_SIGN_NAME:}
    template:
      china: ${TENCENT_SMS_TEMPLATE_CHINA:}
      global: ${TENCENT_SMS_TEMPLATE_GLOBAL:}
  aliyun:
    userid: ${ALIYUN_SMS_USERID:}
    accesskey:
      id: ${ALIYUN_SMS_ACCESSKEY_ID:}
      secret: ${ALIYUN_SMS_ACCESSKEY_SECRET:}
    china:
      templatecode: ${ALIYUN_SMS_CHINA_TEMPLATE:}
    global:
      templatecode: ${ALIYUN_SMS_GLOBAL_TEMPLATE:}

app:
  cron:
    secret: ${CRON_SECRET:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

r2:
  endpoint: ${R2_ENDPOINT:}
  presignEndpoint: ${R2_PRESIGN_ENDPOINT:}
  accessKeyId: ${R2_ACCESS_KEY_ID:}
  secretAccessKey: ${R2_SECRET_ACCESS_KEY:}
  bucketName: ${R2_BUCKET_NAME:gdeiassistant-userdata}
  chatBucketName: ${R2_CHAT_BUCKET_NAME:}
  customDomain: ${R2_CUSTOM_DOMAIN:}

theme:
  grayscale: ${THEME_GRAYSCALE:0}

observability:
  slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:800}
  slow-query-threshold-ms: ${SLOW_QUERY_THRESHOLD_MS:1500}

resilience4j:
  circuitbreaker:
    configs:
      eduSystemDefaults:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 80
      cardSystemDefaults:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
      externalService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 80
    instances:
      eduSystem:
        base-config: eduSystemDefaults
      cardSystem:
        base-config: cardSystemDefaults
      chsiClient:
        base-config: externalService
      libraryClient:
        base-config: externalService
      casClient:
        base-config: externalService

campus:
  upstream:
    # The campus academic/card HTTP services cannot be upgraded by this project.
    edu-base-url: ${CAMPUS_EDU_BASE_URL:http://jwgl.gdei.edu.cn}
    cas-login-url: ${CAMPUS_CAS_LOGIN_URL:https://security.gdei.edu.cn/cas/login}
    portal-login-url: ${CAMPUS_PORTAL_LOGIN_URL:http://portal.gdei.edu.cn:8001/Login}
    card-base-url: ${CAMPUS_CARD_BASE_URL:http://ecard.gdei.edu.cn}
    card-login-url: ${CAMPUS_CARD_LOGIN_URL:http://ecard.gdei.edu.cn:8050/LoginCas.aspx}
    payment-base-url: ${CAMPUS_PAYMENT_BASE_URL:https://epay.gdei.edu.cn:8443/synpay/web}
    alipay-gateway-url: ${CAMPUS_ALIPAY_GATEWAY_URL:https://mapi.alipay.com/gateway.do?_input_charset=utf-8}

# Optional API timeout units are milliseconds; the provider budget covers the complete chain.
outbound:
  http:
    connect-timeout-ms: ${OUTBOUND_HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${OUTBOUND_HTTP_READ_TIMEOUT_MS:6000}
    provider-budget-ms: ${OUTBOUND_PROVIDER_BUDGET_MS:15000}
